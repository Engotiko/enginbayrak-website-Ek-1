<body>
  <div class="shell">
    <nav class="nav" aria-label="Ana menü">
      <a class="brand" href="index.html"><span class="glyph"></span><span data-i18n="brand">Engin Bayrak</span></a>
      <button class="nav-burger" aria-label="Menü">Menü</button>
      <div class="nav-links">

      </div>
      <div class="lang-toggle" role="group" aria-label="Dil / Language">
        <button data-lang="tr">TR</button>
        <button data-lang="en">EN</button>
      </div>
    </nav>

    <section class="contact-grid">
      <div class="contact-left">
        <span class="label" data-i18n="contact.label">İletişim</span>
        <span class="label-rule"></span>
        <h1 class="display" data-i18n="contact.title">İletişime geçin</h1>
        <p class="lede" style="margin-top:16px;max-width:42ch" data-i18n="contact.intro"></p>

        <span class="label" style="margin-top:30px" data-i18n="contact.email.label">E-posta</span>
        <a class="contact-email" href="mailto:engin@enginbayrak.com">engin@enginbayrak.com</a>

        <span class="label" data-i18n="contact.platforms.label">Platformlar & Sosyal</span>
        <div class="social-list" id="social-root"></div>
      </div>

      <div class="contact-right">
        <span class="label" data-i18n="contact.form.label">Mesaj Gönder</span>
        <span class="label-rule"></span>
        <form id="contact-form">
          <div class="field">
            <label for="cf-name" data-i18n="contact.form.name">Ad Soyad</label>
            <input id="cf-name" type="text" required data-i18n-ph="contact.form.name">
          </div>
          <div class="field">
            <label for="cf-email" data-i18n="contact.form.email">E-posta</label>
            <input id="cf-email" type="email" required data-i18n-ph="contact.form.email">
          </div>
          <div class="field">
            <label for="cf-msg" data-i18n="contact.form.msg">Mesajınız</label>
            <textarea id="cf-msg" rows="5" required data-i18n-ph="contact.form.msg"></textarea>
          </div>
          <button class="btn" type="submit" data-i18n="contact.form.send">E-posta ile Gönder</button>
        </form>
      </div>
    </section>

    <footer class="footer">
      <div class="footer-links">

      </div>
      <span class="copyr">© 2026 Engin Bayrak</span>

    </footer>
